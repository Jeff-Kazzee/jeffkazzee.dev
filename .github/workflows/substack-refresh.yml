name: Substack refresh
# Static pages need a rebuild to list new feed posts. This workflow must be
# present on main, Actions must be operational, and the repository secret must
# contain an existing Vercel deploy hook for main. It runs daily, not instantly.
on:
  schedule:
    - cron: '41 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: substack-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check refresh policy
        run: node --test scripts/substack-feed.test.mjs scripts/substack-refresh.test.mjs
      - name: Rebuild when any feed post is missing
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: node scripts/substack-refresh.mjs --request-build
