name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/ci-pnpm-lock.yaml
      - name: Prepare CI-only dependency layout
        run: |
          cp .github/ci-pnpm-lock.yaml pnpm-lock.yaml
          printf 'nodeLinker: hoisted\nignoreScripts: true\n' > pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run agent-surface
      - run: pnpm run build
      - run: pnpm run verify
      - run: node --test scripts/check-live.test.mjs
