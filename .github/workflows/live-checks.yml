name: Live checks
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-live*'
      - '.github/workflows/live-checks.yml'
permissions:
  contents: read
concurrency:
  group: live-checks-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-live.test.mjs
      - name: Check canonical live sites
        if: github.event_name != 'pull_request'
        run: node scripts/check-live.mjs
